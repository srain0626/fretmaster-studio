name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Emoji Invariant & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DSP & Transport unit tests
        run: npm test

      - name: Verify zero-emoji & dingbat invariant
        run: npm run check:emojis

      - name: Build Next.js production bundle
        run: npm run build
